<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><title>theme-toggle example</title><style>html{background:#12161c;color:#f2f5f8;font:18px system-ui}button{min-height:48px;font:inherit;padding:6px 14px}</style></head><body><h1>theme-toggle</h1>
<div id="b"></div><script src="../theme.js"></script><script>var s={theme:'dark'};function r(){document.getElementById('b').innerHTML=ToolkitTheme.button(s.theme)}r();document.addEventListener('click',function(e){if(e.target.dataset.act==='theme'){ToolkitTheme.toggle(s);r()}});</script>
</body></html>
