<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><title>backup-restore example</title><style>html{background:#12161c;color:#f2f5f8;font:18px system-ui}button{min-height:48px;font:inherit;padding:6px 14px}</style></head><body><h1>backup-restore</h1>
<button onclick="ToolkitBackup.save({app:'demo',filename:'demo-backup.json',data:{items:[1,2,3]}})">Save backup</button><button onclick="ToolkitBackup.pick('f')">Restore</button><span id="f-box"></span><script src="../../file-download/download.js"></script><script src="../backup.js"></script><script>document.getElementById('f-box').innerHTML=ToolkitBackup.fileInput('f');document.addEventListener('change',function(e){if(e.target.id==='f')ToolkitBackup.read(e.target.files[0],function(err,b){alert(err?'Not a backup':'Restored '+JSON.stringify(b.data))})});</script>
</body></html>
